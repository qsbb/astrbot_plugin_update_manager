name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout into package directory
        uses: actions/checkout@v4
        with:
          path: astrbot_plugin_update_manager

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: astrbot_plugin_update_manager
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml ruff

      - name: Ruff
        run: ruff check astrbot_plugin_update_manager

      - name: Pytest
        run: python -m pytest astrbot_plugin_update_manager/tests -q
