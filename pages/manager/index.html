<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="title">凝心溯溪-核 · 更新管理</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">AstrBot Plugin Page</p>
        <h1 data-i18n="heading">凝心溯溪-核</h1>
        <p data-i18n="subtitle">安全、串行、可回滚的插件更新控制台</p>
      </div>
      <div class="toolbar">
        <select id="locale" aria-label="Language"><option value="zh-CN">中文</option><option value="en-US">English</option></select>
        <button id="refresh" type="button" data-i18n="refresh">刷新</button>
      </div>
    </header>

    <nav class="tabs" aria-label="Manager sections">
      <button class="active" data-tab="overview" data-i18n="overview">总览</button>
      <button data-tab="recommendations" data-i18n="recommendations">系列推荐</button>
      <button data-tab="config" data-i18n="config">配置</button>
      <button data-tab="catalog" data-i18n="catalog">目录</button>
    </nav>

    <section id="overview" class="panel active">
      <div id="summary" class="cards"><p data-i18n="loading">加载中…</p></div>
      <article class="card"><h2 data-i18n="capabilities">运行时能力</h2><div id="capabilities" class="capability-list"></div></article>
    </section>

    <section id="recommendations" class="panel">
      <div id="self-update-notice" class="self-update-notice" role="status" aria-live="polite" hidden></div>
      <div id="rate-limit-notice" class="rate-limit-notice" role="status" aria-live="polite" hidden></div>
      <article class="card"><div class="section-heading"><div><h2 data-i18n="recommendationsTitle">凝心溯溪系列推荐</h2><p data-i18n="recommendationsHint">官方安装会直接加载；更新和启用由 AstrBot 内部热重载，页面不会额外重复重载。核禁止自更新和自停用。</p></div><button id="check-latest" type="button" data-i18n="checkLatest">检查最新版本</button></div><div id="recommendations-list" class="recommendations-list"><p data-i18n="loading">加载中…</p></div></article>
    </section>

    <section id="config" class="panel">
      <form id="config-form" class="card">
        <div class="section-heading"><div><h2 data-i18n="configTitle">配置读取与保存</h2><p data-i18n="tokenHint">敏感 token 仅显示是否已配置，留空不会覆盖。</p></div><button type="submit" data-i18n="save">保存</button></div>
        <div id="config-fields" class="form-grid"></div>
      </form>
      <form id="rule-form" class="card">
        <div class="section-heading"><div><h2 data-i18n="ruleTitle">每日自动更新</h2><p id="rule-gate-hint"></p></div><button type="submit" data-i18n="saveRule">保存规则</button></div>
        <div class="rule-grid">
          <label class="switch gate-switch"><input id="rule-auto-update-enabled" type="checkbox" role="switch" /><span><strong data-i18n="autoUpdateGate">允许自动更新总闸</strong><small data-i18n="autoUpdateGateHint">关闭时任何每日规则都不会执行自动更新。</small></span></label>
          <label class="switch"><input id="rule-enabled" type="checkbox" /><span data-i18n="ruleEnabled">启用每日规则</span></label>
          <label><span data-i18n="ruleTime">运行时间</span><input id="rule-time" type="time" required /></label>
          <label><span data-i18n="ruleTimezone">时区</span><input id="rule-timezone" type="text" required /></label>
          <label><span data-i18n="rulePolicy">更新策略</span><select id="rule-policy"><option value="check_only" data-i18n="policyCheckOnly">仅检查（check_only）</option><option value="patch" data-i18n="policyPatch">仅补丁版本（patch）</option><option value="minor" data-i18n="policyMinor">允许次版本（minor）</option><option value="stable" data-i18n="policyStable">最新稳定版（stable）</option></select><small id="check-only-note" data-i18n="checkOnlyNote">check_only 仅检查并记录，绝不会更新插件。</small></label>
          <label><span data-i18n="failurePolicy">失败策略</span><select id="rule-failure"><option value="rollback_continue" data-i18n="failureRollbackContinue">回滚后继续（rollback_continue）</option><option value="rollback_stop" data-i18n="failureRollbackStop">回滚并停止（rollback_stop）</option></select></label>
          <label><span data-i18n="jitter">抖动（分钟）</span><input id="rule-jitter" type="number" min="0" max="120" required /></label>
          <label><span data-i18n="minimumAge">最小发布年龄（小时）</span><input id="rule-minimum-age" type="number" min="0" max="8760" required /></label>
          <label class="switch"><input id="rule-prerelease" type="checkbox" /><span data-i18n="prerelease">允许预发行版本</span></label>
        </div>
        <fieldset class="plugin-picker"><legend data-i18n="selectPlugins">选择插件</legend><div id="rule-plugins"></div></fieldset>
        <p class="next-run"><span data-i18n="nextRun">下次运行</span>：<strong id="rule-next-run">—</strong></p>
      </form>
    </section>

    <section id="catalog" class="panel">
      <article class="card"><div class="section-heading"><div><h2 data-i18n="catalogTitle">插件目录</h2><p data-i18n="catalogHint">合并展示运行时插件与已安装元数据；未加载插件不可更新。</p></div></div><div id="catalog-list" class="catalog-list"></div></article>
    </section>
    <div id="startup-error" class="startup-error" role="alert" hidden></div>
    <div id="recommendation-status" class="operation-status" role="status" aria-live="polite" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="confirmation-dialog" aria-labelledby="confirmation-title">
      <form method="dialog">
        <h2 id="confirmation-title" data-i18n="confirmTitle">确认插件操作</h2>
        <p id="confirmation-message"></p>
        <div class="dialog-actions">
          <button type="submit" value="cancel" data-i18n="cancel">取消</button>
          <button type="submit" value="confirm" class="primary" data-i18n="confirmAction">确认操作</button>
        </div>
      </form>
    </dialog>
  </main>
  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
